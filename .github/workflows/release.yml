name: Publish Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v0.1.1"
          fi
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: LanternED ${{ steps.vars.outputs.tag }} Native Ecosystem
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            windows/*.exe
            macos/*.dmg
            android/*.apk
            ios/*.ipa
            manifest.json
            CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
